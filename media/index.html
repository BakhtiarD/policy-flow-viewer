<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none';
               style-src {{CSP_SOURCE}} 'unsafe-inline' https://*.vscode-cdn.net;
               script-src {{CSP_SOURCE}} https://*.vscode-cdn.net;
               img-src {{CSP_SOURCE}} data: https://*.vscode-cdn.net;">
    <link rel="stylesheet" href="{{CSS_URI}}">
    <title>Document Flow</title>
</head>

<body>
    <div class="toolbar" id="mainToolbar">
        <button id="addBtn" data-icon="add" data-i18n-title="btn.add.title"></button>
        <button id="reloadBtn" data-icon="refresh" data-i18n-title="btn.reload.title" class="secondary"></button>
        <button id="collapseAllBtn" data-icon="collapse" data-i18n-title="btn.collapseAll.title" class="secondary"></button>
        <button id="expandAllBtn" data-icon="expand" data-i18n-title="btn.expandAll.title" class="secondary"></button>
        <button id="viewToggle" data-icon="graph" data-i18n-title="btn.viewToggle.title" class="secondary"></button>
        <button id="generateFlowBtn" data-icon="package" data-i18n-title="btn.generateFlow.title"></button>
        <button id="authBtn" data-icon="key" data-i18n-title="btn.auth.title"></button>
        <button id="validateBtn" data-icon="checklist" data-i18n-title="btn.validate.title"></button>
        <button id="relationsBtn" data-icon="link" data-i18n-title="btn.relations.title"></button>
        <button id="attachmentsBtn" data-icon="paperclip" data-i18n-title="btn.attachments.title"></button>
        <button id="compareBtn" class="primary compare-btn" data-icon="compare" data-i18n-title="btn.compare.title"></button>
        <span class="toolbar-spacer"></span>
        <span class="hint" id="metaInfo"></span>
        <button id="toolbarSettingsBtn" data-icon="gear" data-i18n-title="btn.toolbarSettings.title" class="secondary"></button>
        <div id="langPanel" class="lang-panel">
            <div id="langSelectHost"></div>
            <span class="lang-divider"></span>
            <div id="uiLangSelectHost"></div>
        </div>
    </div>

    <div id="tableView">
        <table>
            <colgroup>
                <col class="c0">
                <col class="c1">
                <col class="c2">
                <col class="c3">
                <col class="c4">
            </colgroup>
            <thead>
                <tr>
                    <th class="sortable" id="thState" data-i18n-title="table.th.state.title">
                        <span data-i18n="table.th.state">Состояние</span>
                        <span class="sort-ind" id="sortInd">⇅</span>
                    </th>
                    <th data-i18n-title="table.th.terminal.title" data-i18n="table.th.terminal">Конечное</th>
                    <th data-i18n="table.th.incoming">Входящие переходы</th>
                    <th data-i18n="table.th.outgoing">Исходящие переходы</th>
                    <th data-i18n="table.th.perms">Права доступа</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <div id="graphView">
        <div class="graph-toolbar" id="graphToolbar">
            <button id="editSelectedBtn" data-icon="edit" data-i18n-title="graph.edit.title" class="secondary"
                disabled></button>
            <button id="deleteSelectedBtn" data-icon="trash" data-i18n-title="graph.delete.title" class="danger"
                disabled></button>
            <span class="toolbar-sep"></span>
            <button id="saveGraphBtn" data-icon="save" data-i18n-title="graph.save.title"></button>
            <button id="fitGraphBtn" data-icon="fullscreen" data-i18n-title="graph.fit.title" class="secondary"></button>
            <button id="autoLayoutBtn" data-icon="layout" data-i18n-title="graph.autoLayout.title" class="secondary"></button>
            <button id="optimizeTransitionsBtn" data-icon="optimize" data-i18n-title="graph.optimize.title" class="secondary"></button>
            <button id="alignTransitionsBtn" data-icon="align" data-i18n-title="graph.align.title" class="secondary"></button>
            <button id="layoutDirBtn" data-icon="arrows-v" data-i18n-title="graph.layoutDir.title"
                class="secondary"></button>
            <button id="labelsToggleBtn" data-icon="tag" data-i18n-title="graph.labels.title"
                class="secondary"></button>
            <button id="legendBtn" data-icon="book" data-i18n-title="graph.legend.title" class="secondary"></button>
            <label class="zoom-label">
                <input type="number" id="zoomInput" min="10" max="400" step="10" value="100"> %
            </label>
            <span class="hint" id="graphHint"></span>
            <span class="hint" id="selectionHint"></span>
        </div>
        <div class="graph-container">
            <svg id="graphSvg" tabindex="0" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div id="graphLegend" class="graph-legend" style="display:none">
            <div class="legend-header" data-drag-handle>
                <span class="legend-title" data-i18n="legend.title">Легенда действий</span>
                <button class="legend-close secondary small" data-i18n-title="legend.close.title">×</button>
            </div>
            <div class="legend-body"></div>
        </div>
    </div>

    <div id="matrixView">
        <div class="matrix-container">
            <div class="matrix-grid"></div>
            <div class="matrix-legend"></div>
        </div>
    </div>

    <div id="actorsView">
        <div class="actors-container">
            <table class="actors-table">
                <thead>
                    <tr>
                        <th class="actors-th-actor" data-i18n="actors.th.actor">Актор</th>
                        <th class="actors-th-states" data-i18n="actors.th.states">Состояния</th>
                        <th class="actors-th-transitions" data-i18n="actors.th.transitions">Переходы</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="modalContainer"></div>

    <!-- ============================================================
       ШАБЛОНЫ
       ============================================================ -->

    <!-- Карточка актора в форме add/edit -->
    <template id="tpl-permission-card">
        <div class="item-card">
            <div class="item-card-header">
                <span class="item-card-title" data-i18n="actor.card.title">Актор</span>
                <button class="danger small" data-remove>×</button>
            </div>
            <div class="form-row">
                <label data-i18n="actor.field.label">Актор</label>
                <select class="f-actor"></select>
                <input type="text" class="f-actor-new" data-i18n-placeholder="actor.placeholder.new"
                    style="display:none;margin-top:4px">
                <div class="hint" data-i18n="actor.hint.selectOrNew">Выбери из списка или добавь нового</div>
            </div>
            <div class="form-row">
                <label><input type="checkbox" class="f-allow-comments"> <span data-i18n="actor.checkbox.allowComments">Разрешить комментарии</span></label>
            </div>
            <div class="form-row">
                <label>Operations</label>
                <div class="f-operations checkbox-group"></div>
            </div>
            <div class="form-row">
                <label data-i18n="actor.section.transitions">Переходы</label>
                <div class="f-transitions-table"></div>
                <div class="hint" data-i18n="actor.section.transitionsHint">Отметьте исходящие переходы этого состояния</div>
            </div>
            <div class="form-row">
                <label>Attachments</label>
                <div class="f-attachments"></div>
            </div>
        </div>
    </template>

    <!-- Чекбокс операции -->
    <template id="tpl-op-check">
        <label class="op-item">
            <input type="checkbox" data-op>
            <span class="op-name"></span>
            <span class="op-exclusive" data-i18n-title="actor.op.exclusive.tooltip">
                <input type="checkbox" data-op-exclusive> 🔒
            </span>
        </label>
    </template>

    <!-- Шапка таблицы прав на вложения -->
    <template id="tpl-attach-header">
        <div class="perm-attach-header">
            <span data-i18n="attachments.header.type">Тип вложения</span>
            <span>Create</span>
            <span>Read</span>
            <span>Update</span>
            <span>Delete</span>
        </div>
    </template>

    <!-- Строка прав на вложение -->
    <template id="tpl-attach-row">
        <div class="perm-attach-row">
            <span class="type"></span>
            <label><input type="checkbox" data-att value="Create"> Create</label>
            <label><input type="checkbox" data-att value="Read"> Read</label>
            <label><input type="checkbox" data-att value="Update"> Update</label>
            <label><input type="checkbox" data-att value="Delete"> Delete</label>
        </div>
    </template>

    <!-- Карточка исходящего перехода -->
    <template id="tpl-outgoing-card">
        <div class="item-card">
            <div class="item-card-header">
                <span class="item-card-title" data-i18n="outgoing.title">Исходящий переход</span>
                <button class="danger small" data-remove>×</button>
            </div>
            <div class="form-row">
                <label data-i18n="outgoing.field.to">To (целевое состояние)</label>
                <select class="f-to"></select>
            </div>
            <div class="grid-2">
                <div>
                    <label data-i18n="outgoing.field.name">Код перехода</label>
                    <input type="text" class="f-name" data-i18n-placeholder="outgoing.field.name.placeholder">
                </div>
                <div data-tr-field>
                    <label data-tr-label>Перевод</label>
                    <input type="text" class="f-ru">
                </div>
            </div>
        </div>
    </template>

    <!-- Модалка «Добавить состояние» -->
    <template id="tpl-add-modal">
        <div class="modal-backdrop">
            <div class="modal">
                <h2 data-i18n="state.add.title">Добавить состояние</h2>
                <div class="grid-2">
                    <div class="form-row">
                        <label data-i18n="state.field.code.add">Код состояния (латиница)</label>
                        <input type="text" class="f-new-name" data-i18n-placeholder="state.field.code.placeholder">
                        <div class="hint" data-i18n="state.field.code.hint.add">Этот же код будет записан как EN-перевод</div>
                    </div>
                    <div class="form-row" data-tr-field>
                        <label data-tr-label>Перевод</label>
                        <input type="text" class="f-new-ru">
                    </div>
                </div>
                <div class="form-row">
                    <label><input type="checkbox" class="f-new-term"> <span data-i18n="state.field.terminal">Конечное состояние (isTerminal)</span></label>
                </div>

                <div class="tabs">
                    <div class="tab active" data-tab="trans">
                        <span data-i18n="state.tab.outgoing">Исходящие переходы</span>
                        (<span class="tab-trans-count">0</span>)
                    </div>
                    <div class="tab" data-tab="perms">
                        <span data-i18n="state.tab.perms">Права</span>
                        (<span class="tab-perms-count">0</span>)
                    </div>
                </div>

                <div class="tab-content active" data-tab="trans">
                    <div class="f-trans-list"></div>
                    <button class="secondary" data-act="add-trans" data-i18n="state.btn.addOutgoing">+ Добавить исходящий переход</button>
                </div>

                <div class="tab-content" data-tab="perms">
                    <div class="f-perms-list"></div>
                    <button class="secondary" data-act="add-perm" data-i18n="state.btn.addActor">+ Добавить актора</button>
                </div>

                <div class="actions">
                    <button class="secondary" data-act="cancel" data-i18n="common.cancel">Отмена</button>
                    <button data-act="submit" data-i18n="common.add">Добавить</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Модалка «Редактировать состояние» -->
    <template id="tpl-edit-modal">
        <div class="modal-backdrop">
            <div class="modal">
                <h2 data-i18n="state.edit.title">Редактировать состояние</h2>
                <div class="grid-2">
                    <div class="form-row">
                        <label data-i18n="state.field.code">Код состояния</label>
                        <input type="text" class="f-edit-name">
                        <div class="hint" data-i18n="state.field.code.hint.rename">Переименование обновит все ссылки в 3 файлах</div>
                    </div>
                    <div class="form-row" data-tr-field>
                        <label data-tr-label>Перевод</label>
                        <input type="text" class="f-edit-ru">
                    </div>
                </div>
                <div class="form-row">
                    <label><input type="checkbox" class="f-edit-term"> <span data-i18n="state.field.terminal">Конечное состояние (isTerminal)</span></label>
                </div>

                <div class="readonly-section">
                    <div class="ro-title" data-i18n="state.incoming.title">Входящие переходы (только для справки):</div>
                    <div class="f-incoming"></div>
                </div>

                <div class="tabs">
                    <div class="tab active" data-tab="trans">
                        <span data-i18n="state.tab.outgoing">Исходящие переходы</span>
                        (<span class="tab-trans-count">0</span>)
                    </div>
                    <div class="tab" data-tab="perms">
                        <span data-i18n="state.tab.perms">Права</span>
                        (<span class="tab-perms-count">0</span>)
                    </div>
                </div>

                <div class="tab-content active" data-tab="trans">
                    <div class="f-trans-list"></div>
                    <button class="secondary" data-act="add-trans" data-i18n="state.btn.addOutgoing">+ Добавить исходящий переход</button>
                </div>

                <div class="tab-content" data-tab="perms">
                    <div class="f-perms-list"></div>
                    <button class="secondary" data-act="add-perm" data-i18n="state.btn.addActor">+ Добавить актора</button>
                </div>

                <div class="actions">
                    <button class="secondary" data-act="cancel" data-i18n="common.cancel">Отмена</button>
                    <button data-act="submit" data-i18n="common.save">Сохранить</button>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-transition-modal">
        <div class="modal-backdrop">
            <div class="modal">
                <h2 data-i18n="transition.title.edit">Редактирование перехода</h2>

                <div class="grid-2">
                    <div class="form-row">
                        <label data-i18n="transition.field.code">Код перехода</label>
                        <input type="text" class="f-tr-name">
                    </div>
                    <div class="form-row" data-tr-field>
                        <label data-tr-label>Перевод</label>
                        <input type="text" class="f-tr-ru">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-row">
                        <label data-i18n="transition.field.from">From</label>
                        <input type="text" class="f-tr-from" disabled>
                    </div>
                    <div class="form-row">
                        <label data-i18n="transition.field.to">To (целевое состояние)</label>
                        <select class="f-tr-to"></select>
                    </div>
                </div>

                <fieldset class="form-fieldset">
                    <legend data-i18n="transition.fieldset.additional">Дополнительные свойства</legend>

                    <div class="form-row">
                        <label>actionToRunBefore</label>
                        <div class="f-tr-action-wrap"></div>
                        <div class="hint" data-i18n="transition.hint.action">Пусто — свойство не записывается</div>
                    </div>

                    <div class="form-row">
                        <label><input type="checkbox" class="f-tr-sse"> <span data-i18n="transition.field.serverSide">serverSideEvents (broadcastEvent)</span></label>
                    </div>

                    <div class="form-row">
                        <label>allowOnValidationErrors</label>
                        <select class="f-tr-aove-mode">
                            <option value="none" data-i18n="transition.aove.none">— не задано —</option>
                            <option value="all-true" data-i18n="transition.aove.allTrue">all = true</option>
                            <option value="all-false" data-i18n="transition.aove.allFalse">all = false</option>
                            <option value="codes" data-i18n="transition.aove.codes">codes (список кодов)</option>
                            <option value="exceptForCodes" data-i18n="transition.aove.except">exceptForCodes (список кодов)</option>
                        </select>
                    </div>

                    <div class="form-row f-tr-codes-row" style="display:none">
                        <label data-i18n="transition.field.codes">Коды ошибок (через запятую или с новой строки)</label>
                        <textarea class="f-tr-codes" rows="3"
                            data-i18n-placeholder="transition.field.codes.placeholder"></textarea>
                    </div>
                </fieldset>

                <div class="actions">
                    <button class="secondary" data-act="reset-route" style="display:none" data-i18n="transition.btn.resetRoute">↺ Сбросить маршрут</button>
                    <span style="flex:1"></span>
                    <button class="secondary" data-act="cancel" data-i18n="common.cancel">Отмена</button>
                    <button data-act="submit" data-i18n="common.save">Сохранить</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Сравнение документов: выбор второго документа -->
    <template id="tpl-compare-picker">
        <div class="modal-backdrop">
            <div class="modal compare-picker-modal">
                <h2 data-i18n="compare.picker.title">Сравнить с документом</h2>
                <div class="hint">
                    <span data-i18n="compare.picker.current">Текущий</span>:
                    <b class="cmp-current-name"></b>
                </div>

                <div class="form-row">
                    <label data-i18n="compare.picker.docLabel">Документ проекта</label>
                    <select class="cmp-doc-select"></select>
                    <div class="hint" data-i18n="compare.picker.hint">Выберите из списка или укажите папку вручную</div>
                </div>

                <div class="form-row">
                    <button class="secondary" data-act="pick-folder" data-i18n="compare.picker.pickFolder">📁 Выбрать папку другого документа…</button>
                </div>

                <div class="cmp-selected-info" style="display:none">
                    <div class="hint">
                        <span data-i18n="compare.picker.selected">Выбран</span>:
                        <b class="cmp-selected-name"></b>
                    </div>
                    <div class="hint cmp-selected-path"></div>
                </div>

                <div class="actions">
                    <button class="secondary" data-act="cancel" data-i18n="common.cancel">Отмена</button>
                    <button data-act="compare" disabled data-i18n="compare.picker.compare">Сравнить</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Сравнение документов: панель diff -->
    <template id="tpl-compare-diff">
        <div class="modal-backdrop">
            <div class="modal compare-diff-modal">
                <h2 data-i18n="compare.diff.title">Сравнение документов</h2>

                <div class="cmp-header">
                    <div class="cmp-header-side">
                        <div class="cmp-header-label" data-i18n="compare.diff.current">Текущий</div>
                        <div class="cmp-header-name cmp-header-current"></div>
                    </div>
                    <div class="cmp-header-vs">⇄</div>
                    <div class="cmp-header-side">
                        <div class="cmp-header-label" data-i18n="compare.diff.other">Образец</div>
                        <div class="cmp-header-name cmp-header-other"></div>
                    </div>
                </div>

                <div class="cmp-body"></div>

                <div class="cmp-footer">
                    <span class="cmp-selected-count"></span>
                    <span style="flex:1"></span>
                    <button class="secondary" data-act="select-all-safe" data-i18n="compare.diff.selectSafe">Выбрать всё кроме удаления</button>
                    <button class="secondary" data-act="select-all-add" data-i18n="compare.diff.selectAll">Выбрать всё</button>
                    <button class="secondary" data-act="deselect-all" data-i18n="compare.diff.deselectAll">Снять все</button>
                    <button class="secondary" data-act="close" data-i18n="compare.diff.close">Закрыть</button>
                    <button class="primary" data-act="apply" disabled data-i18n="compare.diff.apply">Применить выбранное</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Диалог-сообщение -->
    <template id="tpl-alert-modal">
        <div class="modal-backdrop dialog-backdrop">
            <div class="modal dialog">
                <h2 class="dlg-title" data-i18n="dlg.message">Сообщение</h2>
                <div class="dlg-text"></div>
                <div class="actions">
                    <button data-act="ok" data-i18n="common.ok">OK</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Диалог-подтверждение -->
    <template id="tpl-confirm-modal">
        <div class="modal-backdrop dialog-backdrop">
            <div class="modal dialog">
                <h2 class="dlg-title" data-i18n="dlg.confirm">Подтверждение</h2>
                <div class="dlg-text"></div>
                <div class="actions">
                    <button class="secondary" data-act="cancel" data-i18n="common.cancel">Отмена</button>
                    <button data-act="ok" data-i18n="common.ok">OK</button>
                </div>
            </div>
        </div>
    </template>


    <template id="tpl-generate-flow-modal">
        <div class="modal-backdrop">
            <div class="modal gen-flow-modal">
                <h2 data-i18n="genFlow.title">Каркас докфлоу</h2>
                <p class="hint" data-i18n="genFlow.hint"></p>

                <section class="gen-section">
                    <h3 data-i18n="genFlow.section.states">1. Состояния</h3>
                    <div class="gen-table-wrap">
                        <table class="gen-table">
                            <thead>
                                <tr>
                                    <th style="width:40px" data-i18n="genFlow.col.num">№</th>
                                    <th data-i18n="genFlow.col.code">Код</th>
                                    <th data-tr-col>Перевод</th>
                                    <th style="width:40px"></th>
                                </tr>
                            </thead>
                            <tbody class="f-gen-states"></tbody>
                        </table>
                    </div>
                    <div class="form-row">
                        <label data-i18n="genFlow.statesInput.label">Введите коды состояний</label>
                        <textarea class="f-gen-states-input" rows="4"
                            data-i18n-placeholder="genFlow.statesInput.placeholder"></textarea>
                    </div>
                    <button class="secondary" data-act="add-states" data-i18n="genFlow.btn.addStates">Добавить состояния</button>
                </section>

                <section class="gen-section">
                    <h3 data-i18n="genFlow.section.transitions">2. Переходы</h3>
                    <div class="gen-table-wrap">
                        <table class="gen-table">
                            <thead>
                                <tr>
                                    <th data-i18n="genFlow.col.code">Код</th>
                                    <th data-i18n="genFlow.col.from">From</th>
                                    <th data-i18n="genFlow.col.to">To</th>
                                    <th data-tr-col>Перевод</th>
                                    <th style="width:40px"></th>
                                </tr>
                            </thead>
                            <tbody class="f-gen-transitions"></tbody>
                        </table>
                    </div>
                    <div class="form-row">
                        <label data-i18n="genFlow.transitionsInput.label">Матрица переходов</label>
                        <textarea class="f-gen-transitions-input" rows="3"
                            data-i18n-placeholder="genFlow.transitionsInput.placeholder"></textarea>
                    </div>
